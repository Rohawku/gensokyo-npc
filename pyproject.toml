[project]
name = "gensokyo-npc"
version = "0.1.0"
description = "LLM-driven NPC agents in Gensokyo — layered memory, emotion state machines, and a deterministic world engine"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "openai>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10,<2",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gensokyo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]
# ruff 0.16 起会格式化 markdown 里的 python 代码块。文档里的片段是**引用**
# 而不是可运行代码：`docs/engineering-log.md` 里刻意对齐的注释被重排过，
# 一处 `tool_calls=decision.tool_calls`（关键字参数）还被改成了赋值语句，
# 把说明本身改成了错的。

[tool.mypy]
python_version = "3.12"
files = ["src/gensokyo"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
