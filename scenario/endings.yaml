- id: hakurei_seal
  by: reimu
  title: 博丽的解决方式
  text: |
    灵梦站在花田中央，把符纸往空中一抛。
    「三天前子时开始歪的，就从那儿掰回来。」
    结界的褶皱被压平的瞬间，那些花一齐失去了颜色。
    无缘塚重新变回一片无人祭扫的墓地，风里再没有让人恍神的甜味。

- id: kirisame_burn
  by: marisa
  title: 魔法使的解决方式
  text: |
    「495 年前有人这么干过，那我照抄就是了。」
    魔理沙把八卦炉举过头顶，光束贯穿整片花田。
    魔力结晶在高温里一颗颗炸开，被吸走的记忆没能回来，
    但至少不会再有人从这里走过之后忘掉自己是谁。

- id: forgotten
  by: null
  title: 遗忘
  text: |
    你在幻想乡里走了太久。
    某天醒来时，你已经想不起自己本来要查什么了——
    只记得有个地方开满了花，很好看。
