- id: S0_UNAWARE
  hint: 你还没注意到幻想乡出了什么事
  objective: 找人打听无缘塚的花。神社的巫女爱钱，但光投币换不来情报——还得聊到她在意的事。

- id: S1_ANOMALY
  hint: 你已经知道无缘塚开满了不该在这个季节盛开的花
  objective: 三个人各知道一部分：神社的巫女、魔法店的魔法使、红魔馆地下室的吸血鬼。

- id: S2_CLUES
  hint: 关于那些花的线索正在陆续浮现
  objective: 还有线索没拿到。灵梦要赛钱、也要聊得来；魔理沙只认交易；芙兰给点东西再陪她聊聊。

- id: S3_SOURCE
  hint: 线索已经凑齐，异变的源头指向无缘塚
  objective: 说服灵梦或魔理沙跟你去无缘塚——你自己解决不了这个，得有人动手。

- id: S4_END
  hint: 这场异变已经了结
  objective: 结束了。
