title: 東方忘却抄 ~ Oblivion Chronicle
text: |
  幻想乡。一片被博丽大结界隔在外界之外的土地，人类与妖怪在这里勉强共处。

  你是从外界掉进来的。掉进来多久了，你自己也说不清——这几天开始，
  你发现有些事想不起来了。昨天吃了什么，上个月住在哪里，为什么会来这里。
  记忆像被人一层层撕掉，而你连自己丢了什么都不知道。

  你只记得一件事：有人说，无缘塚那边最近开满了花。
  不该在这个季节开的花。

  眼下你站在博丽神社的院子里。巫女就在那边，一脸「又来了个麻烦」的表情。
  袖子里还剩几枚赛钱——在幻想乡，这东西比道理好用。

objective_hint: |
  幻想乡的人不会白帮你。想从谁嘴里问出东西，先让她觉得值得开口。
